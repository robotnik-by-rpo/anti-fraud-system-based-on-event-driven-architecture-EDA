syntax = "proto3";

package fraud;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/robotnik-by-rpo/anti-fraud-system-based-on-event-driven-architecture-EDA/shared/grpc/transaction/gen/go;transactionpb";
service SendingTransactionService{
    rpc ProcessingTransaction(TransactionRequest) returns (TransactionResponse);
}

message TransactionRequest{
    uint64 transaction_id = 1;
    Transaction transaction = 2;
    Identity identity = 3;
}

message TransactionResponse{
    uint64 transaction_id = 1;
    bool is_fraud = 2;
    double fraud_score = 3;
}

